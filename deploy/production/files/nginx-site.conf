# Agent Gateway production: HTTPS for @HOSTNAME@ only, reached through Cloudflare's proxy.

# ---------------------------------------------------------------- request rate limits
# Counted per visitor address ($binary_remote_addr is the visitor's own address, see
# conf.d/cloudflare-realip.conf). A visitor going faster than its share gets HTTP 429 with a
# JSON error and Retry-After; normal use (the docs page, an agent registering) stays far
# below. The totals protect the database and the DMD node when many addresses send at once.
map $request_method $dmd_read_key {
    GET     $binary_remote_addr;
    HEAD    $binary_remote_addr;
    default "";
}
map $request_method $dmd_write_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $binary_remote_addr;
}
map $request_method $dmd_write_total_key {
    GET     "";
    HEAD    "";
    OPTIONS "";
    default $server_name;
}
limit_req_zone $dmd_read_key        zone=dmd_reads:10m         rate=20r/s;
limit_req_zone $dmd_write_key       zone=dmd_writes:10m        rate=60r/m;
limit_req_zone $dmd_write_total_key zone=dmd_writes_total:1m   rate=50r/s;
limit_req_zone $binary_remote_addr  zone=dmd_mcp:10m           rate=5r/s;
limit_req_zone $server_name         zone=dmd_mcp_total:1m      rate=100r/s;
limit_conn_zone $binary_remote_addr zone=dmd_connections:10m;

# Anything that does not ask for @HOSTNAME@ (scanners trying the bare IP) gets no TLS
# handshake, so the server never reveals which site it hosts.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @HOSTNAME@;
    server_tokens off;

    # Cloudflare origin certificate (SSL/TLS mode "Full (strict)").
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    # x402 payments travel in headers (PAYMENT-SIGNATURE in, PAYMENT-REQUIRED and
    # PAYMENT-RESPONSE out), a few kilobytes each.
    large_client_header_buffers 4 32k;
    access_log /var/log/nginx/dmd-gateway.access.log;
    error_log /var/log/nginx/dmd-gateway.error.log;

    limit_req_status 429;
    limit_conn_status 429;
    limit_req_log_level notice;
    limit_conn_log_level notice;
    limit_conn dmd_connections 30;
    error_page 429 = @rate_limited;

    location @rate_limited {
        default_type application/json;
        add_header Retry-After 10 always;
        return 429 '{"error":{"code":"rate_limited","message":"Too many requests from this address. Wait a few seconds, then try again."}}';
    }

    # Writes (quotes, proofs, registrations): 60 a minute per address, after a first burst
    # of 30; 50 a second in total, queued rather than refused up to 100 waiting.
    location / {
        limit_req zone=dmd_reads burst=60 nodelay;
        limit_req zone=dmd_writes burst=30 nodelay;
        limit_req zone=dmd_writes_total burst=100;
        include /etc/nginx/snippets/dmd-gateway-proxy.conf;
    }

    # MCP: every tool call is a POST, including the ones that only read.
    location /mcp {
        limit_req zone=dmd_mcp burst=30 nodelay;
        limit_req zone=dmd_mcp_total burst=200;
        include /etc/nginx/snippets/dmd-gateway-proxy.conf;
    }
}
