# Included by the Agent Gateway site (nginx-site.conf) in each location.
proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
# $remote_addr is the visitor's address (see conf.d/cloudflare-realip.conf).
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
# A paid registration may wait for its settlement (Cloudflare itself waits 100 s).
proxy_read_timeout 100s;
proxy_buffer_size 16k;
proxy_buffers 8 16k;
proxy_busy_buffers_size 32k;
proxy_buffering off;
