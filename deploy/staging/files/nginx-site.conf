# Agent Gateway staging: HTTPS for @HOSTNAME@ only, reached through Cloudflare's proxy.

# Anything that does not ask for @HOSTNAME@ (scanners trying the bare IP) gets no TLS
# handshake, so the server never reveals which site it hosts.
server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name @HOSTNAME@;
    server_tokens off;

    # Cloudflare origin certificate (SSL/TLS mode "Full (strict)").
    ssl_certificate /etc/ssl/cloudflare/origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 64k;
    access_log /var/log/nginx/dmd-gateway.access.log;
    error_log /var/log/nginx/dmd-gateway.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # $remote_addr is the visitor's address (see conf.d/cloudflare-realip.conf).
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
}
