# DebitMyData payment route registry.
#
# This file is the single source of truth for what an agent may use to pay DebitMyData.
# It contains NO secrets: receiving addresses for env-sourced rails come from the
# environment, and per-intent addresses are derived at quote time.
#
# A rail is OFF unless its enable flag is true in the environment, and the gateway refuses
# to start if a switched-on rail is incomplete (see src/dmd_gateway/domain/routes.py).
# This follows the directive: "Do not mark a rail as enabled until the related wallet
# support, asset contract, receiving address, price source, settlement verifier, security
# review, and operations procedures are complete."
#
# The native DMD rail prices DMD with the mining-cost reference price (DEC-01, inputs in
# dmd_mining_cost at the end), which the payment worker computes when
# DMD_GW_DMD_PRICE_CHAIN_DATA_FROM is set. On mainnet it also
# needs the gateway's own DMD node with the watch-only receiving wallet.
# The x402 USDC rail also needs, in the environment: DMD_USDC_BASE_MERCHANT_ADDRESS (DEC-08),
# DMD_X402_FACILITATOR_URL (DEC-08) and DMD_BASE_RPC_URL (a Base RPC endpoint).

version: 1

discovery_terms:
  - DebitMyData
  - Agentics Social Spaces
  - DID
  - DID-LLM
  - decentralized identity
  - agent identity
  - agentic identity
  - AI agent identity
  - autonomous agent
  - bot
  - agenticbot
  - claw
  - digital twin
  - agent wallet
  - Coinbase Agentic Wallet
  - x402 payment
  - cryptocurrency payment
  - DebitMyData Proof-of-Work (DMD)
  - data ownership
  - data licensing
  - identity verification
  - agentic services

services:
  did_registration:
    title: DebitMyData Agentic DID-LLM Registration
    # Public wording as specified in the directive ("Use accurate public wording").
    description: >-
      Register a DebitMyData DID-LLM for an autonomous agent, AI agent, bot, agenticbot, claw,
      digital twin, human, organization, or approved digital entity.
      DebitMyData Agentic DID-LLM Registration has a commercial fee of $25.00 USD. Agents may
      request a quote and pay using an approved DebitMyData native DMD wallet,
      Coinbase-compatible x402 payment method, or another supported cryptocurrency wallet
      and asset; people may also pay by debit or credit card where that option is listed.
      Available payment methods are returned dynamically by the DebitMyData
      payment quote service and are subject to network availability, wallet support,
      payment policy, and verification requirements.
    method: POST
    path: /v1/dids/registrations
    commercial_price:
      currency: USD
      amount: "25.00"
      quote_required: true
    payment_options:
      - dmd_pow_native
      - x402_usdc_base
      - card_stripe
      - x402_dmd_wrapped_base
      - solana_usdc
    # Version of the terms an agent accepts with each quote: the version of the terms page
    # served at /policies/terms (DEC-09), which the tests keep equal.
    terms_version: "2026-11-11"
    # Policy pages. A path is a page served by this gateway (see src/dmd_gateway/policies);
    # a full https URL points elsewhere.
    policy_urls:
      site: https://agenticssocialspaces.debitmydata.com/
      terms: /policies/terms
      privacy: /policies/privacy
      security: /policies/security
      payment_policy: /policies/payment-methods
      refund_policy: /policies/refunds
      did_policy: /policies/did

# Donations: the donor chooses the amount, and pays in one call (x402), without a quote.
donations:
  # Towards the AI inference behind DebitMyData's agentic services. Humans donate on
  # debitmydata.com (the "Inference $" button); agents and other wallets donate here.
  inference_donation:
    title: DebitMyData Inference Donation
    description: >-
      A voluntary donation towards the AI inference that runs DebitMyData's agentic
      services, in an amount the donor chooses from 0.50 to 1,000.00 USD, paid in USDC on
      Base through x402. Each donation is answered with a receipt signed by DebitMyData.
    method: POST
    path: /v1/donations/inference
    amount:
      currency: USD
      minimum: "0.50"
      maximum: "1000.00"
    payment_options:
      - x402_usdc_base
    # Donations go to their own wallet ("AgenticInference Pay"), not the DID payment wallet.
    recipients:
      x402_usdc_base: DMD_USDC_BASE_INFERENCE_ADDRESS
    terms_version: "2026-11-11"
    policy_urls:
      site: https://agenticssocialspaces.debitmydata.com/
      terms: /policies/terms
      privacy: /policies/privacy
      security: /policies/security
      payment_policy: /policies/payment-methods
      refund_policy: /policies/refunds

# Products bought for a DID that already exists, paid like the DID (quote, then payment), then
# completed with a receipt signed by DebitMyData and an entitlement on the DID.
#
# BottyBotty for Agentics (Preska Thomas, November 2026): three tiers, each paid once and owned
# by the DID for good. A DID owns one tier; a higher tier costs the difference in price. Off
# until DMD_PRODUCT_BOTTYBOTTY_PROTECTION_ENABLED is true (staging: on).
products:
  bottybotty_entry:
    title: BottyBotty Entry
    description: >-
      BottyBotty for an Agentic that has a DebitMyData DID-LLM, Entry tier, provided through
      DebitMyData's BottyBotty APIs. Paid once and owned by the DID-LLM for good, with a receipt
      signed by DebitMyData and the bottybotty_entry entitlement on the DID-LLM. A DID-LLM owns one
      BottyBotty tier at a time; moving to a higher tier costs only the difference in price.
    path: /v1/products/bottybotty-entry
    commercial_price:
      currency: USD
      amount: "49.00"
    entitlement: bottybotty_entry
    tier:
      group: bottybotty
      rank: 1
      name: Entry
    payment_options:
      - dmd_pow_native
    enable_env: DMD_PRODUCT_BOTTYBOTTY_PROTECTION_ENABLED
    terms_version: "2026-11-11"
    policy_urls:
      site: https://agenticssocialspaces.debitmydata.com/
      terms: /policies/terms
      privacy: /policies/privacy
      security: /policies/security
      payment_policy: /policies/payment-methods
      refund_policy: /policies/refunds
      did_policy: /policies/did

  bottybotty_standard:
    title: BottyBotty Standard
    description: >-
      BottyBotty for an Agentic that has a DebitMyData DID-LLM, Standard tier, provided through
      DebitMyData's BottyBotty APIs. Paid once and owned by the DID-LLM for good, with a receipt
      signed by DebitMyData and the bottybotty_standard entitlement on the DID-LLM. A DID-LLM owns one
      BottyBotty tier at a time; moving to a higher tier costs only the difference in price.
    path: /v1/products/bottybotty-standard
    commercial_price:
      currency: USD
      amount: "99.00"
    entitlement: bottybotty_standard
    tier:
      group: bottybotty
      rank: 2
      name: Standard
    payment_options:
      - dmd_pow_native
    enable_env: DMD_PRODUCT_BOTTYBOTTY_PROTECTION_ENABLED
    terms_version: "2026-11-11"
    policy_urls:
      site: https://agenticssocialspaces.debitmydata.com/
      terms: /policies/terms
      privacy: /policies/privacy
      security: /policies/security
      payment_policy: /policies/payment-methods
      refund_policy: /policies/refunds
      did_policy: /policies/did

  bottybotty_premium:
    title: BottyBotty Premium
    description: >-
      BottyBotty for an Agentic that has a DebitMyData DID-LLM, Premium tier, provided through
      DebitMyData's BottyBotty APIs. Paid once and owned by the DID-LLM for good, with a receipt
      signed by DebitMyData and the bottybotty_premium entitlement on the DID-LLM. A DID-LLM owns one
      BottyBotty tier at a time; moving to a higher tier costs only the difference in price.
    path: /v1/products/bottybotty-premium
    commercial_price:
      currency: USD
      amount: "199.00"
    entitlement: bottybotty_premium
    tier:
      group: bottybotty
      rank: 3
      name: Premium
    payment_options:
      - dmd_pow_native
    enable_env: DMD_PRODUCT_BOTTYBOTTY_PROTECTION_ENABLED
    terms_version: "2026-11-11"
    policy_urls:
      site: https://agenticssocialspaces.debitmydata.com/
      terms: /policies/terms
      privacy: /policies/privacy
      security: /policies/security
      payment_policy: /policies/payment-methods
      refund_policy: /policies/refunds
      did_policy: /policies/did

rails:
  # Primary native rail: direct DMD payment on the DebitMyData PoW chain.
  dmd_pow_native:
    name: DebitMyData coin (native PoW chain)
    stage: initial
    approved: true
    asset:
      symbol: DMD
      decimals: 8
      asset_type: native
      canonical_id: dmd:mainnet/native
      usd_denominated: false
    network: dmd:mainnet
    protocol: dmd_native
    adapter: DMDNativePaymentAdapter
    recipient:
      source: per_intent_address     # unique DMD payment address per intent
    confirmation_policy:
      required_confirmations: 6      # DEC-02: as in the directive's example quote
      watch_after_settlement_hours: 168  # a settled payment is re-checked for reorgs for 7 days
    price_policy:                    # DEC-01: mining-cost reference price (approved interim
      source: dmd_mining_cost        # method until DMD has a market price; computed by the
      max_price_age_seconds: 900     # worker every 5 minutes, see pricing/mining_cost.py)
      max_deviation_bps: 500         # only used with a secondary source
      fallback: refuse_quote
    wallet_compatibility:
      - DebitMyData wallets
      - approved DMD wallets
    enable_env: DMD_RAIL_DMD_POW_NATIVE_ENABLED
    kill_env: DMD_RAIL_DMD_POW_NATIVE_KILL

  # Primary interoperability rail: USDC through x402 on Base (Coinbase Agentic Wallets).
  x402_usdc_base:
    name: USDC via x402 on Base
    stage: initial
    approved: true
    asset:
      symbol: USDC
      decimals: 6
      asset_type: token
      # Circle's USDC on Base (developers.circle.com/stablecoins/usdc-contract-addresses)
      canonical_id: eip155:8453/erc20:0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
      usd_denominated: true
    network: eip155:8453
    protocol: x402
    scheme: exact
    transfer_method: eip3009
    adapter: X402PaymentAdapter
    recipient:
      source: env
      env: DMD_USDC_BASE_MERCHANT_ADDRESS   # DEC-08: DebitMyData's USDC receiving address
    confirmation_policy:
      required_confirmations: 5      # DEC-16: about 10 seconds of Base blocks
    x402:
      asset_eip712_name: USD Coin    # the contract's EIP-712 domain on Base
      asset_eip712_version: "2"
      facilitator_url_env: DMD_X402_FACILITATOR_URL   # DEC-08: production facilitator
      facilitator_key_id_env: DMD_X402_CDP_API_KEY_ID          # Coinbase (CDP) facilitator only
      facilitator_key_secret_env: DMD_X402_CDP_API_KEY_SECRET  # secret: environment only
      rpc_url_env: DMD_BASE_RPC_URL
    wallet_compatibility:
      - Coinbase Agentic Wallet
      - x402-compatible wallets
      - approved Base wallets
    enable_env: DMD_RAIL_X402_USDC_BASE_ENABLED
    kill_env: DMD_RAIL_X402_USDC_BASE_KILL

  # Card payments for people: debit and credit cards on Stripe's own payment page (Stripe
  # Checkout), one page per quote. Card details go to Stripe only, never to the gateway.
  # Needs, in the environment, DMD_STRIPE_SECRET_KEY: a restricted Stripe key (rk_live_...)
  # with Checkout Sessions write, PaymentIntents read and Charges read only
  # (docs/card-payments.md).
  card_stripe:
    name: Debit or credit card
    stage: initial
    approved: false                  # true after the staging test, with DebitMyData's approval
    asset:
      symbol: USD
      decimals: 2                    # amounts in cents
      asset_type: fiat
      canonical_id: iso4217:USD
      usd_denominated: true
    network: stripe:live
    protocol: stripe_checkout
    adapter: StripeCheckoutAdapter
    recipient:
      source: hosted_checkout        # a Stripe payment page made for each quote
    confirmation_policy:
      required_confirmations: 1      # a card payment is final when it succeeds
      watch_after_settlement_hours: 720     # refunds and disputes noticed for 30 days
      recheck_after_settlement_minutes: 15  # each check is a request to Stripe
    quote_ttl_seconds: 1860          # 31 minutes: Stripe's payment page stays open 30 at least
    checkout:
      provider: stripe
      secret_key_env: DMD_STRIPE_SECRET_KEY   # secret: environment only
      product_name: DebitMyData DID-LLM registration
    wallet_compatibility:
      - Debit and credit cards
      - Apple Pay and Google Pay
    enable_env: DMD_RAIL_CARD_STRIPE_ENABLED
    kill_env: DMD_RAIL_CARD_STRIPE_KILL

  # Future rails stay unapproved until they pass their own review (RAIL-01..06).
  # Enable-flag names follow the directive's examples.
  x402_dmd_wrapped_base:
    name: Wrapped DMD via x402 on Base
    stage: future
    approved: false                  # only after formal approval and audit (RAIL-05)
    asset:
      symbol: DMD
      decimals: 8
      asset_type: wrapped_token
      canonical_id: null             # eip155:8453/erc20:<audited wrapped DMD contract>
      usd_denominated: false
    network: eip155:8453
    protocol: x402
    scheme: exact
    transfer_method: permit2
    adapter: X402PaymentAdapter
    recipient:
      source: env
      env: DMD_WRAPPED_DMD_BASE_MERCHANT_ADDRESS
    enable_env: DMD_WRAPPED_DMD_ENABLED
    kill_env: DMD_WRAPPED_DMD_KILL

  solana_usdc:
    name: USDC on Solana
    stage: future
    approved: false                  # approved assets only (RAIL-04)
    asset:
      symbol: USDC
      decimals: 6
      asset_type: token
      canonical_id: null
      usd_denominated: true
    network: solana:mainnet
    protocol: approved_solana_adapter
    adapter: SolanaPaymentAdapter
    recipient:
      source: env
      env: DMD_USDC_SOLANA_MERCHANT_ADDRESS
    wallet_compatibility:
      - Solana-compatible wallets
    enable_env: DMD_SOLANA_PAYMENTS_ENABLED
    kill_env: DMD_SOLANA_PAYMENTS_KILL

# DMD mining-cost price inputs (DEC-01): approved values, reviewed every quarter.
#   electricity: what miners typically pay, industrial rates where mining takes place (the
#     Cambridge Bitcoin Electricity Consumption Index assumes 0.05 USD/kWh), not household
#     prices or a world average;
#   efficiency: energy per terahash of a typical SHA-256 machine, a mix of current machines
#     (about 13-18 J/TH) and older ones still running.
dmd_mining_cost:
  electricity_usd_per_kwh: "0.06"
  efficiency_joules_per_terahash: "20"
  reviewed_on: 2026-10-24
  review_every_days: 92
  # While DMD is young and its mining power small, its mining cost is far below any useful
  # rate: the price is the higher of this minimum and the mining cost, until DMD has a market
  # price. 0.001 USD per DMD: a 25.00 USD DID costs 25,000 DMD.
  minimum_usd_per_dmd: "0.001"
  # Date of DebitMyData's written approval of the minimum (Preska Thomas).
  minimum_approved_on: 2026-10-27
