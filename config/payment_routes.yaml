# DebitMyData payment route registry.
#
# This file is the single source of truth for what an agent may use to pay DebitMyData.
# It contains NO secrets: receiving addresses for env-sourced rails come from the
# environment, and per-intent addresses are derived at quote time.
#
# A rail is OFF unless its enable flag is true in the environment, and the gateway refuses
# to start if a switched-on rail is incomplete (see src/dmd_gateway/domain/routes.py).
# This follows the directive: "Do not mark a rail as enabled until the related wallet
# support, asset contract, receiving address, price source, settlement verifier, security
# review, and operations procedures are complete."
#
# The native DMD rail prices DMD with the mining-cost reference price (DEC-01, inputs in
# dmd_mining_cost at the end), which the payment worker computes when
# DMD_GW_DMD_PRICE_CHAIN_DATA_FROM is set. On mainnet it also
# needs the gateway's own DMD node with the watch-only receiving wallet.
# The x402 USDC rail also needs, in the environment: DMD_USDC_BASE_MERCHANT_ADDRESS (DEC-08),
# DMD_X402_FACILITATOR_URL (DEC-08) and DMD_BASE_RPC_URL (a Base RPC endpoint).

version: 1

discovery_terms:
  - DebitMyData
  - Agentics Social Spaces
  - DID
  - decentralized identity
  - agent identity
  - agentic identity
  - AI agent identity
  - autonomous agent
  - bot
  - agenticbot
  - claw
  - digital twin
  - agent wallet
  - Coinbase Agentic Wallet
  - x402 payment
  - cryptocurrency payment
  - DMD Proof-of-Work
  - data ownership
  - data licensing
  - identity verification
  - agentic services

services:
  did_registration:
    title: DebitMyData Agentic DID Registration
    # Public wording as specified in the directive ("Use accurate public wording").
    description: >-
      Register a DebitMyData DID for an autonomous agent, AI agent, bot, agenticbot, claw,
      digital twin, human, organization, or approved digital entity.
      DebitMyData Agentic DID Registration has a commercial fee of $25.00 USD. Agents may
      request a quote and pay using an approved DebitMyData native DMD wallet,
      Coinbase-compatible x402 payment method, or another supported cryptocurrency wallet
      and asset. Available payment methods are returned dynamically by the DebitMyData
      payment quote service and are subject to network availability, wallet support,
      payment policy, and verification requirements.
    method: POST
    path: /v1/dids/registrations
    commercial_price:
      currency: USD
      amount: "25.00"
      quote_required: true
    payment_options:
      - dmd_pow_native
      - x402_usdc_base
      - x402_dmd_wrapped_base
      - solana_usdc
    # Version of the terms an agent accepts with each quote: the version of the terms page
    # served at /policies/terms (DEC-09), which the tests keep equal.
    terms_version: "2026-10-25"
    # Policy pages. A path is a page served by this gateway (see src/dmd_gateway/policies);
    # a full https URL points elsewhere.
    policy_urls:
      site: https://agenticssocialspaces.debitmydata.com/
      terms: /policies/terms
      privacy: /policies/privacy
      security: /policies/security
      payment_policy: /policies/payment-methods
      refund_policy: /policies/refunds
      did_policy: /policies/did

rails:
  # Primary native rail: direct DMD payment on the DebitMyData PoW chain.
  dmd_pow_native:
    name: DebitMyData Native PoW Payment
    stage: initial
    approved: true
    asset:
      symbol: DMD
      decimals: 8
      asset_type: native
      canonical_id: dmd:mainnet/native
      usd_denominated: false
    network: dmd:mainnet
    protocol: dmd_native
    adapter: DMDNativePaymentAdapter
    recipient:
      source: per_intent_address     # unique DMD payment address per intent
    confirmation_policy:
      required_confirmations: 6      # DEC-02: as in the directive's example quote
    price_policy:                    # DEC-01: mining-cost reference price (approved interim
      source: dmd_mining_cost        # method until DMD has a market price; computed by the
      max_price_age_seconds: 900     # worker every 5 minutes, see pricing/mining_cost.py)
      max_deviation_bps: 500         # only used with a secondary source
      fallback: refuse_quote
    wallet_compatibility:
      - DebitMyData wallets
      - approved DMD wallets
    enable_env: DMD_RAIL_DMD_POW_NATIVE_ENABLED
    kill_env: DMD_RAIL_DMD_POW_NATIVE_KILL

  # Primary interoperability rail: USDC through x402 on Base (Coinbase Agentic Wallets).
  x402_usdc_base:
    name: USDC via x402 on Base
    stage: initial
    approved: true
    asset:
      symbol: USDC
      decimals: 6
      asset_type: token
      # Circle's USDC on Base (developers.circle.com/stablecoins/usdc-contract-addresses)
      canonical_id: eip155:8453/erc20:0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913
      usd_denominated: true
    network: eip155:8453
    protocol: x402
    scheme: exact
    transfer_method: eip3009
    adapter: X402PaymentAdapter
    recipient:
      source: env
      env: DMD_USDC_BASE_MERCHANT_ADDRESS   # DEC-08: DebitMyData's USDC receiving address
    confirmation_policy:
      required_confirmations: 5      # DEC-16: about 10 seconds of Base blocks
    x402:
      asset_eip712_name: USD Coin    # the contract's EIP-712 domain on Base
      asset_eip712_version: "2"
      facilitator_url_env: DMD_X402_FACILITATOR_URL   # DEC-08: production facilitator
      rpc_url_env: DMD_BASE_RPC_URL
    wallet_compatibility:
      - Coinbase Agentic Wallet
      - x402-compatible wallets
      - approved Base wallets
    enable_env: DMD_RAIL_X402_USDC_BASE_ENABLED
    kill_env: DMD_RAIL_X402_USDC_BASE_KILL

  # Future rails stay unapproved until they pass their own review (RAIL-01..06).
  # Enable-flag names follow the directive's examples.
  x402_dmd_wrapped_base:
    name: Wrapped DMD via x402 on Base
    stage: future
    approved: false                  # only after formal approval and audit (RAIL-05)
    asset:
      symbol: DMD
      decimals: 8
      asset_type: wrapped_token
      canonical_id: null             # eip155:8453/erc20:<audited wrapped DMD contract>
      usd_denominated: false
    network: eip155:8453
    protocol: x402
    scheme: exact
    transfer_method: permit2
    adapter: X402PaymentAdapter
    recipient:
      source: env
      env: DMD_WRAPPED_DMD_BASE_MERCHANT_ADDRESS
    enable_env: DMD_WRAPPED_DMD_ENABLED
    kill_env: DMD_WRAPPED_DMD_KILL

  solana_usdc:
    name: USDC on Solana
    stage: future
    approved: false                  # approved assets only (RAIL-04)
    asset:
      symbol: USDC
      decimals: 6
      asset_type: token
      canonical_id: null
      usd_denominated: true
    network: solana:mainnet
    protocol: approved_solana_adapter
    adapter: SolanaPaymentAdapter
    recipient:
      source: env
      env: DMD_USDC_SOLANA_MERCHANT_ADDRESS
    wallet_compatibility:
      - Solana-compatible wallets
    enable_env: DMD_SOLANA_PAYMENTS_ENABLED
    kill_env: DMD_SOLANA_PAYMENTS_KILL

# DMD mining-cost price inputs (DEC-01): approved values, reviewed every quarter.
#   electricity: what miners typically pay, industrial rates where mining takes place (the
#     Cambridge Bitcoin Electricity Consumption Index assumes 0.05 USD/kWh), not household
#     prices or a world average;
#   efficiency: energy per terahash of a typical SHA-256 machine, a mix of current machines
#     (about 13-18 J/TH) and older ones still running.
dmd_mining_cost:
  electricity_usd_per_kwh: "0.06"
  efficiency_joules_per_terahash: "20"
  reviewed_on: 2026-10-24
  review_every_days: 92
