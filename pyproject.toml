[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "dmd-agent-gateway"
version = "0.9.0"
description = "DebitMyData Agent Gateway: discovery, quoting, payment verification and DID issuance for autonomous agents."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "cryptography>=42",
    "mcp>=2.3,<3",
    "eth-account>=0.13",
    "markdown-it-py>=3.0",
]

[project.scripts]
dmd-gateway-worker = "dmd_gateway.worker:main"
dmd-gateway-issuer-key = "dmd_gateway.identity.issuer:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "jsonschema>=4.18",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dmd_gateway"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "DTZ"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"migrations/**" = ["E501"]
